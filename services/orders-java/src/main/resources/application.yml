server:
  port: ${PORT:8082}

spring:
  config:
    import: optional:file:.env
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/sebelas_orders}
    username: ${POSTGRES_USER:sebelas}
    password: ${POSTGRES_PASSWORD:sebelas}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# API endpoints and secrets are read from environment variables via @Value defaults in code.
